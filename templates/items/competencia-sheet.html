<form class="{{cssClass}} mtrol-competencia-sheet" autocomplete="off">

  <header class="sheet-header mtrol-competencia-header">

    <img class="profile-img"
         src="{{item.img}}"
         data-edit="img"
         title="{{item.name}}"
         height="72"
         width="72" />

    <div class="mtrol-competencia-title">

      <input type="text"
             name="name"
             value="{{item.name}}"
             placeholder="Nombre de competencia" />

      <span>Configuración de competencia</span>

    </div>

  </header>

  <section class="sheet-body mtrol-competencia-body">

    <!-- CONFIGURACIÓN -->
    <div class="sheet-section mtrol-competencia-section">

      <h2>Configuración</h2>

      <div class="form-grid">

        <div>
          <label>Nivel</label>

          <input type="number"
                 name="system.nivel"
                 value="{{system.nivel}}"
                 min="1"
                 max="5" />
        </div>

        <div>
          <label>Tipo</label>

          <input type="text"
                 name="system.tipo"
                 value="{{system.tipo}}"
                 placeholder="ataque-magico" />
        </div>

        <div>
          <label>Atributo Base</label>

          <input type="text"
                 name="system.atributo"
                 value="{{system.atributo}}"
                 placeholder="aura" />
        </div>

        <div>
          <label>Coste MP</label>

          <input type="number"
                 name="system.costeMP"
                 value="{{system.costeMP}}"
                 min="0" />
        </div>

        <div class="wide">
          <label>Fórmula de Tirada</label>

          <input type="text"
                 name="system.formula"
                 value="{{system.formula}}"
                 placeholder="1d10 + @atributos.aura" />
        </div>

        <div class="wide">
          <label>Fórmula de Daño</label>

          <input type="text"
                 name="system.danio"
                 value="{{system.danio}}"
                 placeholder="2d10 + @atributos.aura" />
        </div>

        <div class="checkbox-field">
          <label>Usa Daño Localizado</label>

          <input type="checkbox"
                 name="system.usaDanioLocalizado"
                 {{checked system.usaDanioLocalizado}} />
        </div>

      </div>

    </div>

    <!-- FX -->
    <div class="sheet-section mtrol-competencia-section">

      <h2>FX Visuales</h2>

      <div class="form-grid">

        <div>
          <label>FX Visual</label>

          <input type="text"
                 name="system.fx.visual"
                 value="{{system.fx.visual}}"
                 placeholder="jb2a.fire_bolt.orange" />
        </div>

        <div>
          <label>FX Sonido</label>

          <input type="text"
                 name="system.fx.sonido"
                 value="{{system.fx.sonido}}"
                 placeholder="sounds/fireball.ogg" />
        </div>

        <div>
          <label>Duración</label>

          <input type="number"
                 name="system.fx.duracion"
                 value="{{system.fx.duracion}}"
                 min="0" />
        </div>

        <div>
          <label>Escala</label>

          <input type="number"
                 step="0.1"
                 name="system.fx.escala"
                 value="{{system.fx.escala}}"
                 min="0" />
        </div>

      </div>

    </div>

    <!-- DESCRIPCIÓN -->
    <div class="sheet-section mtrol-competencia-section">

      <h2>Descripción</h2>

      <textarea name="system.descripcion"
                rows="8"
                placeholder="Describe el efecto, alcance, uso narrativo o condición de la competencia.">{{system.descripcion}}</textarea>

    </div>

  </section>

</form>
