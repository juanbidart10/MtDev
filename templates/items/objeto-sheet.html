<form class="{{cssClass}}" autocomplete="off">

  <header class="sheet-header">
    <div class="header-left">
      <img class="profile-img"
           src="{{item.img}}"
           data-edit="img"
           title="{{item.name}}"
           height="96"
           width="96"/>
    </div>

    <div class="header-right">
      <div class="charname">
        <label>Nombre</label>
        <input type="text" name="name" value="{{item.name}}">
      </div>
    </div>
  </header>

  <section class="sheet-section">
    <h2>Datos del Objeto</h2>

    <div class="identidad-grid">

      <div>
        <label>Tipo de objeto</label>

        <select name="system.tipoObjeto">
          {{#each tiposObjeto as |tipo|}}
            <option value="{{tipo.value}}" {{#if tipo.selected}}selected{{/if}}>
              {{tipo.label}}
            </option>
          {{/each}}
        </select>
      </div>

      <div>
        <label>Cantidad</label>

        <input type="number"
               name="system.cantidad"
               value="{{system.cantidad}}"
               min="0">
      </div>

      <div>
        <label>Slots usados</label>

        <input type="number"
               name="system.slots"
               value="{{system.slots}}"
               min="0">
      </div>

      <div>
        <label>Valor</label>

        <input type="number"
               name="system.valor"
               value="{{system.valor}}"
               min="0">
      </div>

      <div>
        <label>¿Es equipable?</label>

        <input type="checkbox"
               name="system.equipable"
               {{checked system.equipable}}>
      </div>

      <div>
        <label>Equipado</label>

        <input type="checkbox"
               name="system.equipado"
               {{checked system.equipado}}>
      </div>

      <div>
        <label>Slot corporal</label>

        <select name="system.slot">
          {{#each slotsCorporales as |slot|}}
            <option value="{{slot.value}}" {{#if slot.selected}}selected{{/if}}>
              {{slot.label}}
            </option>
          {{/each}}
        </select>
      </div>

      <div>
        <label>Defensa actual</label>

        <input type="number"
               name="system.defensa"
               value="{{system.defensa}}"
               min="0">
      </div>

      <div>
        <label>Defensa base</label>

        <input type="number"
               name="system.defensaBase"
               value="{{system.defensaBase}}"
               min="0">
      </div>

      <div>
        <label>Daño</label>

        <input type="text"
               name="system.danio"
               value="{{system.danio}}">
      </div>

    </div>
  </section>

  <section class="sheet-section">

    <h2>Descripción</h2>

    <textarea name="system.descripcion"
              rows="8">{{system.descripcion}}</textarea>

  </section>

</form>
